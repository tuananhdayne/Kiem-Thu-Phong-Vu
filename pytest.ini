[pytest]
testpaths = tests
addopts = -ra -v -m "smoke and not destructive and not security" --strict-markers --html=reports/report.html --self-contained-html
log_cli = true
log_cli_level = INFO
markers =
	smoke: fast core checks that run by default
	regression: prioritized regression checks for filter/sort/search
	slow: regression cases excluded from default runs
	security: black-box security payload checks; run only on authorized/demo targets
	destructive: resource-heavy or intentionally stressful browser checks; never run by default
	framework: internal Selenium/helper checks, not direct business website behavior
